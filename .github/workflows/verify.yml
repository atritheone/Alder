name: Verify Alder source
on:
  push:
  pull_request:
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -B scripts/setup/cli.py validate
      - run: python -B -m unittest discover -s tests/setup -v
      - run: node scripts/validate-setup-metadata.mjs
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r requirements-core.lock.txt
      - run: python -m pytest backend/tests
        env:
          PYTHONPATH: backend
  # Resource-complete release checks run after provisioning the large runtime/model
  # bundle. They include all publishing/card tests and isolated desktop smoke tests;
  # no GPU or several-gigabyte model download is required for this source CI job.
