name: Native operating performance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opening:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked developer dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native Electron
        run: node node_modules/electron/install.js
      - name: Prepare isolated core runtime
        shell: bash
        run: python scripts/developer/prepare-opening-runtime.py --state "$RUNNER_TEMP/alder-opening-core"
      - name: Build for the native OS
        run: npm run build
      - name: Check startup, import, and recovery boundaries
        shell: bash
        run: '"$PYTHON" -B -m pytest backend/tests/test_startup.py backend/tests/test_proofreading.py backend/tests/test_sentence_revisions.py backend/tests/test_plain_text_file.py backend/tests/test_plain_text_api.py backend/tests/test_save_changes.py backend/tests/test_project_changes.py backend/tests/test_plain_validation.py backend/tests/test_core.py backend/tests/test_document_schema.py -q -p no:cacheprovider'
      - name: Compare plain validation with the general validator
        shell: bash
        run: '"$PYTHON" -B scripts/developer/benchmark-plain-validation.py --output "$RUNNER_TEMP/validation-results/validation.json"'
      - name: Check bounded editor decorations and typing
        run: npm exec vitest run -- frontend/src/plainTextChanges.test.ts frontend/src/operatingCaches.test.ts frontend/src/projectTimeline.test.ts frontend/src/plainTextTools.test.ts frontend/src/speechTransport.test.ts frontend/src/runPatternSearch.test.ts frontend/src/patternSearch.test.ts frontend/src/apiCancellation.test.ts frontend/src/publicationCancellation.test.ts frontend/src/saveChanges.test.ts frontend/src/useProject.test.ts --reporter=dot
      - name: Native startup and TXT/DOCX opening
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/developer/benchmark-operations.mjs --output "$RUNNER_TEMP/operating-results"
            xvfb-run -a node scripts/developer/test-startup-lifecycle.mjs
            xvfb-run -a node scripts/developer/test-operation-lifecycle.mjs
          else
            node scripts/developer/benchmark-operations.mjs --output "$RUNNER_TEMP/operating-results"
            node scripts/developer/test-startup-lifecycle.mjs
            node scripts/developer/test-operation-lifecycle.mjs
          fi
      - name: Retain timings and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operating-${{ matrix.os }}
          path: ${{ runner.temp }}/operating-results/report.json
      - name: Retain paired native validation timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          path: ${{ runner.temp }}/validation-results/validation.json
